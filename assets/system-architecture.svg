<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">สถาปัตยกรรม PortfolioMatch และ Gemini</title><desc id="desc">React frontend เก็บข้อมูลใน localStorage; เมื่อยินยอม Next.js Route Handler ส่ง PDF ชั่วคราวไป Gemini API; ไม่มี database หรือ file storage</desc><rect width="1280" height="720" fill="#f6f7f4"/><g font-family="sans-serif"><text x="60" y="72" font-size="32" font-weight="700" fill="#17191f">System Architecture · Current Demo</text><text x="60" y="108" font-size="18" fill="#666c75">PortfolioMatch · สถานะ 1 พ.ย. 2569</text><rect x="60" y="155" width="290" height="205" rx="20" fill="#fff" stroke="#dfe1dc" stroke-width="2"/><text x="88" y="205" font-size="24" font-weight="700" fill="#17191f">ผู้สมัคร / กรรมการ</text><text x="88" y="252" font-size="18" fill="#555365">กรอกข้อมูล เลือก PDF</text><text x="88" y="289" font-size="18" fill="#555365">ตรวจผลและ Approve / Reject</text><rect x="420" y="155" width="420" height="205" rx="20" fill="#17191f"/><text x="450" y="205" font-size="25" font-weight="700" fill="#fff">Next.js + React UI</text><text x="450" y="250" font-size="18" fill="#fff">Form · Dashboard · Detail</text><text x="450" y="287" font-size="18" fill="#c9c7e7">TypeScript · CSS · Lucide</text><text x="365" y="267" font-size="33" fill="#6855d9">→</text><rect x="900" y="155" width="320" height="205" rx="20" fill="#fff" stroke="#dfe1dc" stroke-width="2"/><text x="930" y="205" font-size="25" font-weight="700" fill="#17191f">localStorage</text><text x="930" y="250" font-size="17" fill="#555365">รอบ ผู้สมัคร ผล AI สถานะ</text><text x="930" y="287" font-size="17" fill="#555365">เฉพาะเบราว์เซอร์เดียว</text><text x="850" y="267" font-size="33" fill="#6855d9">↔</text><rect x="270" y="420" width="360" height="150" rx="20" fill="#eae7ff" stroke="#b9aefd" stroke-width="2"/><text x="300" y="465" font-size="23" font-weight="700" fill="#17191f">Next.js Route Handler</text><text x="300" y="505" font-size="17" fill="#555365">/api/analyze-portfolio</text><text x="300" y="540" font-size="17" fill="#555365">ตรวจ PDF และเกณฑ์</text><rect x="740" y="420" width="300" height="150" rx="20" fill="#eae7ff" stroke="#b9aefd" stroke-width="2"/><text x="770" y="465" font-size="25" font-weight="700" fill="#17191f">Gemini API</text><text x="770" y="505" font-size="17" fill="#555365">PDF + requirement</text><text x="770" y="540" font-size="17" fill="#555365">คืนคะแนนและหลักฐาน</text><path d="M560 361 V408 M630 495 H728" fill="none" stroke="#6855d9" stroke-width="4"/><text x="646" y="484" font-size="27" fill="#6855d9">→</text><text x="72" y="475" font-size="17" fill="#555365">เมื่อยินยอม</text><rect x="60" y="626" width="1160" height="58" rx="12" fill="#fff" stroke="#dfe1dc"/><text x="86" y="662" font-size="17" fill="#6a4343">ยังไม่มี Database · File storage · Authentication · Rate limit · ข้อมูลข้ามเครื่อง</text></g></svg>