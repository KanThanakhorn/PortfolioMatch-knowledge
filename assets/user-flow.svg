<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc">
<title id="title">User flow สำหรับการสาธิต PortfolioMatch</title><desc id="desc">อาจารย์สร้างรอบและลิงก์ ผู้สมัครกรอกฟอร์มและเลือก PDF ระบบบันทึกข้อมูลเดโมในเบราว์เซอร์ อาจารย์ดูรายชื่อและอนุมัติหรือปฏิเสธ</desc>
<rect width="1280" height="600" fill="#f6f7f4"/><text x="60" y="72" font-family="sans-serif" font-size="32" font-weight="700" fill="#17191f">User Flow · Single Browser Demo</text><text x="60" y="108" font-family="sans-serif" font-size="18" fill="#666c75">ลำดับที่ทดสอบได้ในต้นแบบปัจจุบัน</text>
<g font-family="sans-serif"><rect x="60" y="175" width="210" height="170" rx="18" fill="#17191f"/><text x="86" y="216" font-size="17" fill="#a9e95f">01 · อาจารย์</text><text x="86" y="258" font-size="25" fill="#fff" font-weight="700">กำหนดรอบ</text><text x="86" y="298" font-size="17" fill="#ddd">สร้างลิงก์ตัวอย่าง</text>
<rect x="300" y="175" width="210" height="170" rx="18" fill="#fff" stroke="#dfe1dc" stroke-width="2"/><text x="326" y="216" font-size="17" fill="#6855d9">02 · ผู้สมัคร</text><text x="326" y="258" font-size="25" fill="#17191f" font-weight="700">กรอกข้อมูล</text><text x="326" y="298" font-size="17" fill="#666c75">เลือก PDF</text>
<rect x="540" y="175" width="210" height="170" rx="18" fill="#fff" stroke="#dfe1dc" stroke-width="2"/><text x="566" y="216" font-size="17" fill="#6855d9">03 · ระบบเดโม</text><text x="566" y="258" font-size="25" fill="#17191f" font-weight="700">บันทึกข้อมูล</text><text x="566" y="298" font-size="17" fill="#666c75">ลง localStorage</text>
<rect x="780" y="175" width="210" height="170" rx="18" fill="#fff" stroke="#dfe1dc" stroke-width="2"/><text x="806" y="216" font-size="17" fill="#6855d9">04 · อาจารย์</text><text x="806" y="258" font-size="25" fill="#17191f" font-weight="700">ตรวจรายชื่อ</text><text x="806" y="298" font-size="17" fill="#666c75">ดูคะแนน mock</text>
<rect x="1020" y="175" width="210" height="170" rx="18" fill="#f0eeff" stroke="#c5bdfb" stroke-width="2"/><text x="1046" y="216" font-size="17" fill="#6855d9">05 · อาจารย์</text><text x="1046" y="258" font-size="25" fill="#17191f" font-weight="700">ตัดสินใจ</text><text x="1046" y="298" font-size="17" fill="#666c75">Approve / Reject</text>
<path d="M270 260 H292 M510 260 H532 M750 260 H772 M990 260 H1012" stroke="#6855d9" stroke-width="4"/><text x="60" y="420" font-size="20" font-weight="700" fill="#17191f">ขอบเขตที่ต้องพูดให้ชัด</text><text x="60" y="459" font-size="18" fill="#666c75">ลิงก์ใช้ข้อมูลร่วมกันได้เฉพาะ origin และเบราว์เซอร์เดียวกัน · ไม่มีการเก็บเนื้อไฟล์ PDF · ไม่มี AI วิเคราะห์จริง</text><rect x="60" y="507" width="1170" height="51" rx="11" fill="#fff" stroke="#dfe1dc"/><text x="84" y="539" font-size="17" fill="#6a4343">การใช้หลายเครื่อง / หลายผู้ใช้ต้องมี backend และฐานข้อมูลในระยะถัดไป</text></g>
</svg>
