<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc"><title id="title">User flow หลังเชื่อม Supabase</title><desc id="desc">กรรมการล็อกอินและสร้างรอบ ผู้สมัครเปิดลิงก์อีกเบราว์เซอร์ ส่งใบสมัคร เลือก AI ได้ แล้วกรรมการตรวจและตัดสิน</desc><rect width="1280" height="620" fill="#f6f7f4"/><defs><style>text{font-family:Arial,'Noto Sans Thai',sans-serif}.title{font-size:32px;font-weight:700;fill:#17191f}.sub{font-size:19px;fill:#59616c}.head{font-size:24px;font-weight:700;fill:#17191f}.body{font-size:18px;fill:#3e4650}.small{font-size:16px;fill:#59616c}.dark{fill:#fff}.line{stroke:#6855d9;stroke-width:4;fill:none}</style></defs><text x="55" y="68" class="title">User Flow · Supabase demo</text><text x="55" y="105" class="sub">API/DB ผ่านแล้ว · UI ข้ามเบราว์เซอร์รอ QA จากตง</text><g><rect x="55" y="175" width="210" height="200" rx="18" fill="#17191f"/><text x="78" y="216" class="small dark">01 · กรรมการ</text><text x="78" y="263" class="head dark">ล็อกอิน</text><text x="78" y="306" class="body dark">สร้างรอบ + ลิงก์</text><rect x="295" y="175" width="210" height="200" rx="18" fill="#fff" stroke="#dfe1dc" stroke-width="2"/><text x="318" y="216" class="small">02 · ผู้สมัคร</text><text x="318" y="263" class="head">เปิดลิงก์</text><text x="318" y="306" class="body">กรอกข้อมูล + PDF</text><rect x="535" y="175" width="210" height="200" rx="18" fill="#fff" stroke="#dfe1dc" stroke-width="2"/><text x="558" y="216" class="small">03 · API/DB</text><text x="558" y="263" class="head">บันทึก</text><text x="558" y="306" class="body">Supabase + RLS</text><rect x="775" y="175" width="210" height="200" rx="18" fill="#fff" stroke="#dfe1dc" stroke-width="2"/><text x="798" y="216" class="small">04 · AI (opt-in)</text><text x="798" y="263" class="head">Gemini</text><text x="798" y="306" class="body">สรุปหลักฐาน</text><rect x="1015" y="175" width="210" height="200" rx="18" fill="#eae7ff" stroke="#b9aefd" stroke-width="2"/><text x="1038" y="216" class="small">05 · กรรมการ</text><text x="1038" y="263" class="head">ตรวจ/ตัดสิน</text><text x="1038" y="306" class="body">Approve/Reject</text><path d="M265 275H285 M505 275H525 M745 275H765 M985 275H1005" class="line"/></g><rect x="55" y="445" width="1170" height="120" rx="16" fill="#fff" stroke="#dfe1dc" stroke-width="2"/><text x="80" y="488" class="body">ไม่ยินยอม AI → ข้ามขั้น Gemini และยังบันทึกใบสมัครได้</text><text x="80" y="525" class="small">PDF ต้นฉบับไม่ถูกเก็บ · กรรมการต้องตรวจหลักฐานนอกระบบ · UI flow รอผล retest</text></svg>