<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" role="img" aria-labelledby="title desc"><title id="title">ขอบเขต Supabase demo และงานก่อนใช้จริง</title><desc id="desc">มี Auth, PostgreSQL/RLS, รอบและใบสมัครข้ามเบราว์เซอร์, Gemini opt-in; ยังต้องเพิ่ม PDF storage, rate limit, audit, backup, AI recovery และ QA</desc><rect width="1280" height="660" fill="#f6f7f4"/><defs><style>text{font-family:Arial,'Noto Sans Thai',sans-serif}.title{font-size:32px;font-weight:700;fill:#17191f}.sub{font-size:19px;fill:#59616c}.head{font-size:24px;font-weight:700;fill:#17191f}.body{font-size:18px;fill:#3e4650}.small{font-size:16px;fill:#59616c}.dark{fill:#fff}.lime{fill:#a9e95f}.line{stroke:#6855d9;stroke-width:4;fill:none}</style></defs><text x="55" y="68" class="title">System Scope · 1 พ.ย. 2569</text><text x="55" y="105" class="sub">สิ่งที่ทำแล้วในเดโม / สิ่งที่ต้องเพิ่มก่อนใช้งานจริง</text><rect x="55" y="155" width="560" height="445" rx="20" fill="#17191f"/><rect x="665" y="155" width="560" height="445" rx="20" fill="#fff" stroke="#dfe1dc" stroke-width="2"/><text x="85" y="215" class="head lime">มีใน Supabase demo</text><text x="695" y="215" class="head">ต้องพัฒนาต่อ</text><text x="85" y="280" class="body dark">✓ Auth และสิทธิ์กรรมการ / RLS</text><text x="85" y="338" class="body dark">✓ รอบ + ใบสมัครข้ามเบราว์เซอร์</text><text x="85" y="396" class="body dark">✓ Dashboard / Approve / Reject</text><text x="85" y="454" class="body dark">✓ Gemini opt-in และบันทึกผล AI</text><text x="85" y="512" class="body dark">✓ localStorage mode สำรอง</text><text x="695" y="280" class="body">○ PDF storage / ตรวจย้อนหลัง</text><text x="695" y="338" class="body">○ Durable rate limit / audit log</text><text x="695" y="396" class="body">○ Backup / retention / AI recovery</text><text x="695" y="454" class="body">○ บังคับ deadline ตามวัน</text><text x="695" y="512" class="body">○ QA UI / load / AI fairness</text></svg>