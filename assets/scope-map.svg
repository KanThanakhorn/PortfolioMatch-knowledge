<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="title desc">
<title id="title">ขอบเขตระบบและสิ่งที่จะพัฒนาต่อ</title><desc id="desc">เปรียบเทียบฟีเจอร์ต้นแบบที่มีแล้วกับฟีเจอร์ที่ยังไม่มี</desc><rect width="1280" height="660" fill="#f6f7f4"/><text x="60" y="72" font-family="sans-serif" font-size="32" font-weight="700" fill="#17191f">System Scope · What Exists Today</text><text x="60" y="108" font-family="sans-serif" font-size="18" fill="#666c75">ใช้แยกขอบเขตต้นแบบออกจากแนวทางพัฒนาระบบจริง</text><rect x="60" y="160" width="550" height="430" rx="22" fill="#17191f"/><rect x="670" y="160" width="550" height="430" rx="22" fill="#fff" stroke="#dfe1dc" stroke-width="2"/><g font-family="sans-serif"><text x="96" y="220" font-size="26" font-weight="700" fill="#a9e95f">มีในต้นแบบ</text><text x="706" y="220" font-size="26" font-weight="700" fill="#6855d9">ต้องพัฒนาต่อ</text><text x="96" y="282" font-size="19" fill="#fff">✓ ตั้งค่า requirement รอบตัวอย่าง</text><text x="96" y="339" font-size="19" fill="#fff">✓ แบบฟอร์มและตรวจข้อมูล</text><text x="96" y="396" font-size="19" fill="#fff">✓ บันทึกผู้สมัครในเบราว์เซอร์</text><text x="96" y="453" font-size="19" fill="#fff">✓ Approve / Reject ในเบราว์เซอร์</text><text x="96" y="510" font-size="19" fill="#fff">✓ คะแนนตัวอย่างที่กำหนดไว้</text><text x="706" y="282" font-size="19" fill="#17191f">○ Backend และฐานข้อมูลหลายผู้ใช้</text><text x="706" y="339" font-size="19" fill="#17191f">○ File storage สำหรับ PDF จริง</text><text x="706" y="396" font-size="19" fill="#17191f">○ AI วิเคราะห์ Portfolio จริง</text><text x="706" y="453" font-size="19" fill="#17191f">○ Login / สิทธิ์ / Audit log</text><text x="706" y="510" font-size="19" fill="#17191f">○ ทดสอบกับผู้ใช้จริงและหลายเครื่อง</text></g></svg>
